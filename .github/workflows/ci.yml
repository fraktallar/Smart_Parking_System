name: Smart Parking Microservices CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v3

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Docker Konteynırlarını Çalıştır
      run: |
        docker-compose up -d --build || docker compose up -d --build
        docker ps

    - name: Servislerin Ayağa Kalkmasını Bekle
      run: sleep 15

    - name: Postman / Newman Testlerini Çalıştır
      run: |
        npm install -g newman
        newman run postman_collection.json || true

    - name: Konteynırları Temizle
      run: docker-compose down || docker compose down